name: android
# Signed Play bundle in the cloud (Gradle can't run on Anthony's Windows machine: SentinelOne blocks the
# JVM loopback socket), attached to a release, then uploaded to Play with keyless Workload Identity auth.
# applicationId is com.compofelice.woodlandstrailguide_flutter (permanent). versionCode = the +N in
# pubspec.yaml, so bump it before a release build. Upload key = repo secrets (same names as gslc-app).
on:
  workflow_dispatch:
    inputs:
      play_track:
        description: "Upload the AAB to this Play track (none = build only)"
        type: choice
        options: [internal, alpha, none]
        default: internal
      notes:
        description: "Release notes (optional, en-US)"
        required: false
  push:
    tags: ["android-v*"]
permissions:
  contents: write
  id-token: write
concurrency:
  group: android-build
  cancel-in-progress: false
jobs:
  aab:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.1'   # matches the Windows machine; bump deliberately
          channel: stable
          cache: true
      - run: flutter pub get
      - name: Restore the upload key
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.ANDROID_STORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          test -n "$KEYSTORE_BASE64" || { echo "::error::signing secrets missing"; exit 1; }
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/upload.jks"
          {
            echo "storeFile=$RUNNER_TEMP/upload.jks"
            echo "storePassword=$STORE_PASSWORD"
            echo "keyAlias=$KEY_ALIAS"
            echo "keyPassword=$KEY_PASSWORD"
          } > android/key.properties
      - run: flutter build appbundle --release
      - name: Shred the key
        if: always()
        run: rm -f "$RUNNER_TEMP/upload.jks" android/key.properties
      - name: Check it is signed
        run: keytool -printcert -jarfile build/app/outputs/bundle/release/app-release.aab | grep -q SHA256
      - name: Attach the bundle to a release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          raw=$(grep '^version:' pubspec.yaml | sed 's/version:[[:space:]]*//')
          tag="android-${raw/+/-}"
          gh release view "$tag" >/dev/null 2>&1 || gh release create "$tag" --title "Android $raw" \
            --notes "Play bundle for $raw, built from $GITHUB_SHA." --prerelease
          cp build/app/outputs/bundle/release/app-release.aab "trailguide-${raw/+/-}.aab"
          gh release upload "$tag" "trailguide-${raw/+/-}.aab" --clobber
      - name: Google auth (keyless Workload Identity, never expires)
        if: github.event_name == 'push' || inputs.play_track != 'none'
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: projects/896206213654/locations/global/workloadIdentityPools/github/providers/compo-cf
          service_account: play-publisher@restaurantsfeed.iam.gserviceaccount.com
      - uses: actions/setup-python@v5
        if: github.event_name == 'push' || inputs.play_track != 'none'
        with:
          python-version: "3.12"
      - name: Upload to Play
        if: github.event_name == 'push' || inputs.play_track != 'none'
        env:
          TRACK: ${{ inputs.play_track || 'internal' }}
          NOTES: ${{ inputs.notes }}
        run: |
          pip install -q google-api-python-client==2.151.0 google-auth==2.36.0
          python scripts/play_upload.py --package com.compofelice.woodlandstrailguide_flutter \
            --aab build/app/outputs/bundle/release/app-release.aab --track "$TRACK" --notes "$NOTES"
